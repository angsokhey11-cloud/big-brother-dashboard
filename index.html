<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  BIG BROTHER — Secure Dashboard
</title>

<style>

html,
body{
  margin:0;
  min-height:100%;
  background:#eef3f8;
  font-family:Arial,sans-serif;
}

.bb-loader{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.bb-card{
  background:#fff;
  border:1px solid #d9e2ef;
  border-radius:14px;
  padding:22px 28px;
  box-shadow:0 8px 30px #173a6615;
  color:#17457a;
  font-weight:800;
}

.bb-sub{
  margin-top:6px;
  color:#6b7280;
  font-size:12px;
  font-weight:600;
}

</style>

</head>


<body>


<div class="bb-loader">

  <div class="bb-card">

    Loading BIG BROTHER Dashboard…

    <div class="bb-sub">
      Secure Supabase · Expenses + COGS Reports V1
    </div>

  </div>

</div>



<script>

(async function(){

  "use strict";


  try{


    /* =====================================================
       LOAD LEGACY DASHBOARD
       ===================================================== */

    const response =
      await fetch(
        "legacy-dashboard-v3.40.html?v=20260912-15",
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "Could not load Dashboard source."
      );

    }


    let html =
      await response.text();



    /* =====================================================
       HELPER
       ===================================================== */

    function mustReplace(
      label,
      oldText,
      newText
    ){

      if(
        !html.includes(
          oldText
        )
      ){

        throw new Error(
          label +
          " marker was not found."
        );

      }


      html =
        html.replace(
          oldText,
          newText
        );

    }



    /* =====================================================
       SUPABASE AUTH / PERMISSION ADAPTER
       ===================================================== */

    const adapter =
      '<scr'
      +
      'ipt src="supabase-dashboard-adapter.js?v=20260912-cogs-1"></scr'
      +
      'ipt>';


    const headClose =
      html
        .toLowerCase()
        .indexOf(
          "</head>"
        );


    if(
      headClose < 0
    ){

      throw new Error(
        "Dashboard source is missing </head>."
      );

    }


    html =
      html.slice(
        0,
        headClose
      )
      +
      adapter
      +
      "\n"
      +
      html.slice(
        headClose
      );



    /* =====================================================
       MASTER DATA
       EXPENSE CATEGORY MENU
       ===================================================== */

`            <div id="productsEditorSubmenu" class="nav-submenu nav-submenu-level2">

          </button>

      productRouteWithExpenseCategory

       MASTER DATA ACTIVE FLAGS
       ===================================================== */

`    const isCustomerModule = customerModules.includes(moduleName);

            : 'navProductDetails';

        document.getElementById(productNavId)?.classList.add('active');
      }

`      if (isProductModule) {
        const productNavId =
          moduleName === 'products-add'
            ? 'navProductAdd'
            : 'navProductDetails';

        document.getElementById(productNavId)?.classList.add('active');

      newProductActive

    /* =====================================================

`          <button type="button" id="navExpenseAccrued" onclick="loadWorkspace('expense-accrued')">⏳ Accrued Expenses</button>
          <button type="button" id="navExpenseHistory" onclick="loadWorkspace('expense-history')">📜 Expense History</button>
          <button
  type="button"
  id="navExpenseMonthlyReport"

>
  📊 Monthly Expense Report
</button>

`          <button type="button" id="navExpenseAccrued" onclick="loadWorkspace('expense-accrued')">⏳ Accrued Expenses</button>
          <button type="button" id="navExpenseHistory" onclick="loadWorkspace('expense-history')">📜 Expense History</button>

          <button

            <button

              class="nested-nav-toggle"
              aria-expanded="false"
              aria-controls="cogsSubmenu"
              onclick="toggleCogsMenu()"
            >

              <span class="nested-nav-main">

                <span>📦</span>

                <span>
                  COGS
                </span>

              </span>

              <span class="nav-arrow">
                ▼
              </span>

            </button>


            <div
              id="cogsSubmenu"
              class="nav-submenu nav-submenu-level2"
            >

              <button

                id="navCogsDaily"

    mustReplace(
      "COGS menu under Expenses",
      oldExpenseEnd,
      newExpenseEnd
    );



    /* =====================================================
       COGS ROUTES
       ===================================================== */

    const expenseRoute =
      '"expense-monthly-report": "https://angsokhey11-cloud.github.io/big-brother-expenses/monthly-report.html?embed=1&v=1",';


    const expenseRoutesWithCogs =
      expenseRoute
      +
      '\n    "cogs-daily": "https://angsokhey11-cloud.github.io/big-brother-cogs/daily.html?embed=1&v=20260912-2",'
      +
      '\n    "cogs-monthly": "https://angsokhey11-cloud.github.io/big-brother-cogs/monthly.html?embed=1&v=20260912-2",';


    mustReplace(
      "COGS Dashboard routes",
      expenseRoute,
      expenseRoutesWithCogs
    );



    /* =====================================================
       EXPENSE MODULE LIST
       ===================================================== */

    const oldExpenseModules =
`    const expenseModules = [
      'expense-add',
      'expense-accrued',
      'expense-history',
      'expense-monthly-report'
    ];`;


    const newExpenseModules =
`    const expenseModules = [
      'expense-add',
      'expense-accrued',
      'expense-history',
      'expense-monthly-report',
      'cogs-daily',
      'cogs-monthly'
    ];`;


    mustReplace(
      "COGS Expense module list",
      oldExpenseModules,
      newExpenseModules
    );



    /* =====================================================
       COGS NESTED MENU TOGGLE
       ===================================================== */

    const productToggleMarker =
`  function toggleProductsEditorMenu() {`;


    const cogsToggle =
`  function toggleCogsMenu() {

    const submenu =
      document.getElementById('cogsSubmenu');

    const button =
      document.getElementById('cogsMenuButton');

    if (!submenu || !button) return;

    const open =
      !submenu.classList.contains('open');

    submenu.classList.toggle('open', open);

    button.classList.toggle('open', open);

    button.setAttribute(
      'aria-expanded',
      String(open)
    );

    const arrow =
      button.querySelector('.nav-arrow');

    if (arrow) {
      arrow.textContent =
        open ? '▲' : '▼';
    }

  }


  function toggleProductsEditorMenu() {`;


    mustReplace(
      "COGS toggle function",
      productToggleMarker,
      cogsToggle
    );



    /* =====================================================
       COGS ACTIVE MENU STATE
       ===================================================== */

    const oldExpenseActive =
`      const expenseId =
        moduleName === 'expense-add'
          ? 'navExpenseAdd'
          : moduleName === 'expense-accrued'
            ? 'navExpenseAccrued'
            : moduleName === 'expense-history'
              ? 'navExpenseHistory'
              : 'navExpenseMonthlyReport';

      document.getElementById(expenseId)?.classList.add('active');

    } else if (isStockModule) {`;


    const newExpenseActive =
`      const expenseId =
        moduleName === 'expense-add'
          ? 'navExpenseAdd'
          : moduleName === 'expense-accrued'
            ? 'navExpenseAccrued'
            : moduleName === 'expense-history'
              ? 'navExpenseHistory'
              : moduleName === 'expense-monthly-report'
                ? 'navExpenseMonthlyReport'
                : moduleName === 'cogs-daily'
                  ? 'navCogsDaily'
                  : 'navCogsMonthly';

      document.getElementById(expenseId)?.classList.add('active');


      const isCogsModule =
        moduleName === 'cogs-daily'
        ||
        moduleName === 'cogs-monthly';


      const cogsSub =
        document.getElementById('cogsSubmenu');

      const cogsBtn =
        document.getElementById('cogsMenuButton');


      if (cogsSub && cogsBtn) {

        cogsSub.classList.toggle(
          'open',
          isCogsModule
        );

        cogsBtn.classList.toggle(
          'open',
          isCogsModule
        );

        cogsBtn.setAttribute(
          'aria-expanded',
          String(isCogsModule)
        );

        const cogsArrow =
          cogsBtn.querySelector(
            '.nav-arrow'
          );

        if (cogsArrow) {
          cogsArrow.textContent =
            isCogsModule
              ? '▲'
              : '▼';
        }

      }


    } else if (isStockModule) {`;


    mustReplace(
      "COGS active Expense menu",
      oldExpenseActive,
      newExpenseActive
    );



    /* =====================================================
       COGS DIRECT URL AUTOLOAD
       ===================================================== */

    html =
      html.replace(

        "'expense-history','expense-monthly-report','stock-keyin'",

        "'expense-history','expense-monthly-report','cogs-daily','cogs-monthly','stock-keyin'"

      );



    /* =====================================================
       ADMIN USER & PERMISSION MANAGER
       ===================================================== */

    const adminMenuMarker =
      '<button type="button" id="navAdminRequest" onclick="loadWorkspace(\'admin-request\')">🛠️ Admin Request</button>';


    mustReplace(

      "Admin User Permission menu",

      adminMenuMarker,

      adminMenuMarker
      +
      '\n          <button type="button" id="navAdminUserPermissions" onclick="loadWorkspace(\'admin-user-permissions\')">🔐 User & Permission Manager</button>'

    );



    const adminUrlMarker =
      '"admin-request": "https://angsokhey11-cloud.github.io/big-brother-admin-work/?embed=1&view=admin-request"';


    mustReplace(

      "Admin User Permission route",

      adminUrlMarker,

      adminUrlMarker
      +
      ',\n    "admin-user-permissions": "https://angsokhey11-cloud.github.io/big-brother-admin-work/user-permissions.html?embed=1&v=1"'

    );



    /* =====================================================
       ADMIN ACTIVE ROUTE
       ===================================================== */

    const adminCondition =
`moduleName === 'admin-staff-request' ||
      moduleName === 'admin-request'
    ) {`;


    const adminConditionNew =
`moduleName === 'admin-staff-request' ||
      moduleName === 'admin-request' ||
      moduleName === 'admin-user-permissions'
    ) {`;


    mustReplace(
      "Admin active route condition",
      adminCondition,
      adminConditionNew
    );



    const adminActiveMarker =
`: moduleName === 'admin-staff-request'
                  ? 'navAdminStaffRequest'
                  : 'navAdminRequest';`;


    const adminActiveReplacement =
`: moduleName === 'admin-staff-request'
                  ? 'navAdminStaffRequest'
                  : moduleName === 'admin-user-permissions'
                    ? 'navAdminUserPermissions'
                    : 'navAdminRequest';`;


    mustReplace(
      "Admin active menu marker",
      adminActiveMarker,
      adminActiveReplacement
    );



    /* =====================================================
       INVOICE REVERSAL SHELL
       ===================================================== */

    html =
      html.replace(

        '<a href="https://angsokhey11-cloud.github.io/big-brother-invoice-reversal/">',

        '<a href="#" onclick="loadWorkspace(\'sale-return\'); return false;">'

      );



    /* =====================================================
       INVOICE GENERATOR
       ===================================================== */

    html =
      html.replace(

        'invoice: "https://angsokhey11-cloud.github.io/big-brother-invoice-generator/"',

        'invoice: "https://angsokhey11-cloud.github.io/big-brother-invoice-generator/?embed=1&v=33"'

      );



    /* =====================================================
       SALES SUPPORT
       ===================================================== */

    html =
      html.replaceAll(

        "https://angsokhey11-cloud.github.io/big-brother-sales-support/?embed=1&view=calculator&v=110",

        "https://angsokhey11-cloud.github.io/big-brother-sales-support/?embed=1&view=calculator&v=111"

      );


    html =
      html.replaceAll(

        "https://angsokhey11-cloud.github.io/big-brother-sales-support/?embed=1&view=request-delivery&v=110",

        "https://angsokhey11-cloud.github.io/big-brother-sales-support/?embed=1&view=request-delivery&v=111"

      );


    html =
      html.replaceAll(

        "https://angsokhey11-cloud.github.io/big-brother-sales-support/?embed=1&view=your-customer&v=110",

        "https://angsokhey11-cloud.github.io/big-brother-sales-support/?embed=1&view=your-customer&v=111"

      );


    html =
      html.replaceAll(

        "https://angsokhey11-cloud.github.io/big-brother-sales-support/?embed=1&view=successful-delivery&v=110",

        "https://angsokhey11-cloud.github.io/big-brother-sales-support/?embed=1&view=successful-delivery&v=111"

      );



    /* =====================================================
       PURCHASE — PROMOTION QTY V1
       ===================================================== */

    html =
      html.replace(

        '"purchase-create": "https://angsokhey11-cloud.github.io/big-brother-purchase-recorder/?embed=1&v=1"',

        '"purchase-create": "https://angsokhey11-cloud.github.io/big-brother-purchase-recorder/?embed=1&v=20260912-promo-3"'

      );


    html =
      html.replace(

        '"purchase-history": "https://angsokhey11-cloud.github.io/big-brother-puchase-history/?embed=1&v=1"',

        '"purchase-history": "https://angsokhey11-cloud.github.io/big-brother-puchase-history/?embed=1&v=20260912-promo-3"'

      );



    /* =====================================================
       STOCK — ZERO-COST STOCK V1
       ===================================================== */

    html =
      html.replace(

        '"stock-keyin": "https://angsokhey11-cloud.github.io/big-brother-stock-managemenet/?embed=1&view=keyin&v=20"',

        '"stock-keyin": "https://angsokhey11-cloud.github.io/big-brother-stock-managemenet/?embed=1&view=keyin&v=20260912-zero-cost-6"'

      );


    html =
      html.replace(

        '"stock-report": "https://angsokhey11-cloud.github.io/big-brother-stock-report/?embed=1&v=30"',

        '"stock-report": "https://angsokhey11-cloud.github.io/big-brother-stock-report/?embed=1&v=20260912-zero-cost-3"'

      );


    html =
      html.replace(

        '"stock-damaged": "https://angsokhey11-cloud.github.io/big-brother-stock-managemenet/?embed=1&view=damaged&v=20"',

        '"stock-damaged": "https://angsokhey11-cloud.github.io/big-brother-stock-managemenet/?embed=1&view=damaged&v=20260912-zero-cost-6"'

      );


    html =
      html.replace(

        '"batch-report": "https://angsokhey11-cloud.github.io/big-brother-stock-report/batch-report.html?embed=1&v=10"',

        '"batch-report": "https://angsokhey11-cloud.github.io/big-brother-stock-report/batch-report.html?embed=1&v=20260912-zero-cost-3"'

    html =
      html.replace(

        '"closed-batch": "https://angsokhey11-cloud.github.io/big-brother-stock-report/closed-batch.html?embed=1&v=10"',

    html =

      );



    /* =====================================================
       ACCOUNTS RECEIVABLE
       ===================================================== */

    html =
      html.replace(

        '"ar-all": "https://angsokhey11-cloud.github.io/big-brother-ar/?embed=1&view=all&v=5"'

    html =

        '"ar-your": "https://angsokhey11-cloud.github.io/big-brother-ar/?embed=1&view=your&v=3"',

        '"payment-history": "https://angsokhey11-cloud.github.io/big-brother-payment-history/?embed=1&type=invoice&v=3"'

    html =
      html.replace(

        '"ar-payment-history": "https://angsokhey11-cloud.github.io/big-brother-payment-history/?embed=1&type=receivable&v=1"',

        '"ar-payment-history": "https://angsokhey11-cloud.github.io/big-brother-payment-history/?embed=1&type=receivable&v=3"'

      );



    /* =====================================================
       SUPABASE DASHBOARD START
       ===================================================== */

    const startupMarker =
      "  window.addEventListener('DOMContentLoaded', openInitialWorkspace);";


    const startupReplacement =
      "  window.addEventListener('DOMContentLoaded', () => window.BBDashboardAdapter.start());";


    mustReplace(
      "Dashboard startup",
      startupMarker,
      startupReplacement
    );



    /* =====================================================
       TITLE
       ===================================================== */

    html =
      html.replace(

        "<title>BIG BROTHER — Dashboard V3.38 Stock Transactions Active</title>",

        "<title>BIG BROTHER — Secure Supabase Dashboard</title>"

      );



    /* =====================================================
       EXISTING DASHBOARD FEATURE FILES
       ===================================================== */

    const bodyClose =
      html
        .toLowerCase()
        .lastIndexOf(
          "</body>"
        );


    if(
      bodyClose < 0
    ){

      throw new Error(
        "Dashboard source is missing </body>."
      );

    }


    const featureScripts =

      '<scr'
      +
      'ipt src="supabase-company-features.js?v=20260910-3"></scr'
      +
      'ipt>\n'

      +

      '<scr'
      +
      'ipt src="damaged-stock-dashboard.js?v=5"></scr'
      +
      'ipt>\n';



    html =

      html.slice(
        0,
        bodyClose
      )

      +

      featureScripts

      +

      html.slice(
        bodyClose
      );



    /* =====================================================
       OPEN FINAL DASHBOARD
       ===================================================== */

    document.open();

    document.write(
      html
    );

    document.close();


  }catch(error){


    console.error(
      error
    );


    document.body.innerHTML =

      '<div class="bb-loader">'

      +

      '<div class="bb-card">'

      +

      'Could not open Dashboard'

      +

      '<div class="bb-sub">'

      +

      String(
        error &&
        error.message
          ? error.message
          : error
      )

      +

      '</div>'

      +

      '</div>'

      +

      '</div>';

  }


})();

</script>


</body>

</html>
