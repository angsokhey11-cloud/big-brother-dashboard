<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Stock</title></head><body style="font:14px Arial;color:#17304f;padding:16px"><div id="boot" role="status">Opening saved Your Stock…</div><script>
(async function(){
 const status=document.getElementById('boot');
 try{
  const response=await fetch('/big-brother-sales-support/your-stock.html',{cache:'no-store'});
  if(!response.ok)throw Error('Current stock interface is not saved yet. Connect to update.');
  let html=await response.text();
  const marker=/async function rpc\(name,args=\{\}\)\{/g;
  if((html.match(marker)||[]).length!==1||!html.includes('bb_sales_support_batch_carryforward_totals'))throw Error('Stock source changed. Offline update required.');
  html=html.replace(marker,'async function rpc(name,args={}){return window.BBStaffOfflineV12.rpc(name,args);\n');
  const head=html.toLowerCase().indexOf('</head>');
  if(head<0)throw Error('Stock interface unavailable.');
  html=html.slice(0,head)+'<scr'+'ipt src="mobile-offline-staff-adapter-v12.js?v=20261128-shared-stock-v1"></scr'+'ipt><style>.bb-report-damage-link{display:none!important}</style>'+html.slice(head);
  html=html.replace("rpc('bb_sales_support_batch_carryforward_totals',{p_batch_id:batchId})","rpc('bb_sales_support_batch_carryforward_totals',{p_batch_id:batchId})");
  const check="  if(!response?.success||response.batchId!==batchId||!Array.isArray(response.items))";
  if(html.split(check).length!==2)throw Error('Stock validation changed.');
  html=html.replace(check,"  if(!transfers.success)throw new Error('Transfer history for this batch is not saved. Open Your Stock online to synchronize.');\n"+check);
  document.open();document.write(html);document.close();
 }catch(error){status.textContent=error.message||'Saved stock unavailable.';}
})();
</script></body></html>
