<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sales Support</title></head><body><div id="boot" role="status">Opening saved Calculator…</div><script>
(async function(){const status=document.getElementById('boot');try{
const r=await fetch('/big-brother-sales-support/index.html',{cache:'no-store'});if(!r.ok)throw Error('Current Sales Support interface not saved. Reconnect to update.');
let html=await r.text();
const replacements=[
[/src="dual-currency-sales-support-patch\.js\?[^"]+"/g,'src="/big-brother-sales-support/dual-currency-sales-support-patch.js"'],
[/fetch\('legacy-google-v1\.10\.html\?[^']+',\{cache:'default'\}\)/g,"fetch('/big-brother-sales-support/legacy-google-v1.10.html',{cache:'no-store'})"],
[/src="supabase-sales-support-adapter\.js\?[^"]+"/g,'src="mobile-offline-calculator-adapter-v1.js?v=20261128-shared-support-v1"']
];
for(const [pattern,value] of replacements){if((html.match(pattern)||[]).length!==1)throw Error('Sales Support source changed. Offline update required.');html=html.replace(pattern,value);}
const marker='    document.open();';
if(html.split(marker).length!==2)throw Error('Sales Support initialization changed.');
const safety= "html=html.replaceAll('initializePublicMode(false);','initializePublicMode(true);');\nconst offlineSafety='<style>.add-location-customer,#bbCalcShareTelegram,#bbDeliveryYes,#submitDeliveryBtn,[data-view=\"request-delivery\"],[data-view=\"successful-delivery\"],.bb-history-delivery-btn{display:none!important}</style>';html=html.replace('</head>',offlineSafety+'</head>');\n";
html=html.replace(marker,()=>safety+marker);
const params=new URLSearchParams(location.search);params.set('view','calculator');params.set('mobile','1');history.replaceState(history.state,'',location.pathname+'?'+params.toString());
document.open();document.write(html);document.close();
}catch(error){status.textContent=error.message||'Saved interface unavailable.';}})();
</script></body></html>
