<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monthly Sales</title></head><body><div id="boot" role="status">Opening saved Monthly Sales…</div><script>
(async function(){const status=document.getElementById('boot');try{
const r=await fetch('/big-brother-report/monthly-sales-mobile.html?bb_saved_ui=1',{cache:'no-store'});if(!r.ok)throw Error('Current monthly interface not saved. Reconnect to update.');
let html=await r.text();const marker=/async function rpc\(fn,args=\{\}\)\{/g;if((html.match(marker)||[]).length!==1)throw Error('Monthly report source changed.');
html=html.replace(marker,()=>"async function rpc(fn,args={}){\n const host=window.parent?.BBMobileOfflineWorkspaceV1;let user;try{user=JSON.parse(localStorage.getItem(SESSION_KEY)||'null')?.user?.id}catch(_){}\n if(!host||!user||host.currentUserId()!==user)throw Error('Saved report session unavailable.');\n let key;const period=Number(args.p_year)+'-'+String(Number(args.p_month)).padStart(2,'0');\n if(fn==='bb_current_access_profile')key='access-profile';\n else if(fn==='bb_report_monthly_sales')key='offline-monthly::'+period;\n else if(fn==='bb_report_monthly_sales_product_groups')key='offline-monthly-groups-v1';\n else if(fn==='bb_report_monthly_product_sold_daily')key='offline-monthly-daily::'+period+'::'+String(args.p_product_code||'');\n else throw Error('This operation requires internet.');\n const record=await host.read(key);if(host.currentUserId()!==user||!record?.value)throw Error('This report has not been saved. Open it online first.');\n return record.value;\n }"+'\nasync function unusedMonthlyRpc(fn,args={}){');
html=html.replace(/src="(monthly-(?:product-groups|product-daily|daily-a4-export)-v1\.js[^"]*)"/g,'src="/big-brother-report/$1"');
html=html.replace(/<script src="https:\/\/cdnjs[^"]+"><\/script>/g,'');
html=html.replace('</head>','<style>.bb-daily-export-bar{display:none!important}</style></head>');
document.open();document.write(html);document.close();
}catch(error){status.textContent=error.message||'Saved report unavailable.';}})();
</script></body></html>
