<title>BIG BROTHER — Batch Selling Tracker Mobile</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7fb}
#trackerFrame{display:block;width:100%;height:100%;border:0;background:#f4f7fb}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f4f7fb;color:#17457a;font:800 12px Arial,Helvetica,sans-serif;z-index:5}

</style>

<body>
<div id="boot">Loading Batch Selling Tracker…</div>
<iframe id="trackerFrame" src="mobile-offline-tracker-source-v12.html?mobile=1&v=20261028-v12" title="Batch Selling Tracker"></iframe>
<script>
(function(){
'use strict';
const frame=document.getElementById('trackerFrame');
const boot=document.getElementById('boot');
frame.addEventListener('load',()=>boot.classList.add('hide'));
setTimeout(()=>boot.classList.add('hide'),5000);
})();
</script>
</body>
