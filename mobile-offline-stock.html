<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Stock</title></head><body><div id="boot" role="status">Opening saved Live Stock…</div><script>
(async function(){const status=document.getElementById('boot');try{
const responses=await Promise.all([fetch('/big-brother-stock-report/mobile.html',{cache:'no-store'}),fetch('/big-brother-stock-report/index.html',{cache:'no-store'})]);
if(responses.some(r=>!r.ok))throw Error('Current stock interface not saved. Reconnect to update.');
let [html,engine]=await Promise.all(responses.map(r=>r.text()));
const a=engine.indexOf('async function rpc('),b=engine.indexOf("/* ============================================================\n   SOURCE FIELD HELPERS",a);
if(a<0||b<0||!engine.includes('startAutoRefresh();'))throw Error('Stock source changed.');
engine=engine.slice(0,a)+"async function rpc(functionName,args={}){\n  if(functionName!=='bb_stock_report_fast')throw new Error('This function requires online access.');\n  const api=window.parent?.BBMobileOfflineWorkspaceV1;\n  const session=readSession();\n  if(!api||!session?.user?.id||api.currentUserId()!==String(session.user.id)){\n    throw new Error('Please sign in and synchronize your Stock Report online first.');\n  }\n  const record=await api.read('offline-stock-report-full');\n  if(!record?.value?.success)throw new Error('No saved Stock Report. Open the Stock Report online once to sync.');\n  return record.value;\n}\n\n"+engine.slice(b);
engine=engine.replace('startAutoRefresh();','/* saved data: no polling */');
const marker=/const response=await fetch\('index\.html\?[^']+',\{cache:'default'\}\);/g;
if((html.match(marker)||[]).length!==1)throw Error('Mobile stock wrapper changed.');
html=html.replace(marker,()=> 'const response={ok:true,text:async()=>'+JSON.stringify(engine).replaceAll('<','\\u003c')+'};');
document.open();document.write(html);document.close();
}catch(error){status.textContent=error.message||'Saved stock unavailable.';}})();
</script></body></html>
