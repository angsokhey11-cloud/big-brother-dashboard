const MOBILE_SCRIPT=`(function(){
'use strict';
function clean(v){return String(v==null?'':v).trim()}
function wrapField(el,label,cls){if(!el||el.parentElement?.classList.contains('bb-mobile-filter-field'))return el?.parentElement;const w=document.createElement('div');w.className='bb-mobile-filter-field '+(cls||'');const l=document.createElement('label');l.textContent=label;el.parentNode.insertBefore(w,el);w.appendChild(l);w.appendChild(el);return w}
function ensureFilters(){const filters=document.querySelector('.filters');if(!filters)return false;const from=document.getElementById('dateFrom'),to=document.getElementById('dateTo'),loc=document.getElementById('locationFilter');if(!from||!to||!loc)return false;wrapField(from,'Collection Date','bb-date-from-wrap');wrapField(to,'Date To','bb-date-to-wrap');wrapField(loc,'Location','bb-location-wrap');let customer=document.getElementById('bbCustomerSearch');if(!customer){customer=document.createElement('input');customer.type='search';customer.id='bbCustomerSearch';customer.placeholder='Search customer...';customer.autocomplete='off';const w=document.createElement('div');w.className='bb-mobile-filter-field';w.innerHTML='<label>Customer Search</label>';w.appendChild(customer);filters.insertBefore(w,filters.querySelector('.btn'));}let status=document.getElementById('bbStatusFilter');if(!status){status=document.createElement('select');status.id='bbStatusFilter';status.innerHTML='<option value="">All Status</option>';const w=document.createElement('div');w.className='bb-mobile-filter-field';w.innerHTML='<label>Status</label>';w.appendChild(status);filters.insertBefore(w,filters.querySelector('.btn'));}let actions=filters.querySelector('.bb-filter-actions');if(!actions){actions=document.createElement('div');actions.className='bb-filter-actions';const buttons=[...filters.querySelectorAll(':scope > .btn')];filters.appendChild(actions);buttons.forEach(b=>actions.appendChild(b));}customer.addEventListener('input',()=>{try{mainPage=1;applyFilters()}catch(_){}});status.addEventListener('change',()=>{try{mainPage=1;applyFilters()}catch(_){}});from.addEventListener('change',()=>{to.value=from.value;});return true}
function populateStatus(){const s=document.getElementById('bbStatusFilter');if(!s||typeof groups==='undefined'||typeof groupRequestStatus!=='function')return;const keep=s.value;const values=[...new Set(groups.map(g=>clean(groupRequestStatus(g))).filter(Boolean))].sort();s.innerHTML='<option value="">All Status</option>'+values.map(v=>'<option value="'+v.replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'">'+v.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</option>').join('');if(values.includes(keep))s.value=keep}
function installFilterOverride(){if(window.__bbCollectionFilterInstalled)return true;if(typeof groups==='undefined'||typeof renderGroups!=='function'||typeof groupRequestStatus!=='function'||typeof MAIN_PAGE_SIZE==='undefined')return false;window.__bbCollectionFilterInstalled=true;applyFilters=function(){const f=document.getElementById('dateFrom')?.value||'';const t=f;const l=document.getElementById('locationFilter')?.value||'';const q=clean(document.getElementById('bbCustomerSearch')?.value).toLowerCase();const st=clean(document.getElementById('bbStatusFilter')?.value).toLowerCase();filteredGroups=groups.filter(g=>{const customer=(g.invoices||[]).some(inv=>clean(inv.customer).toLowerCase().includes(q));return(!f||g.saleDate>=f)&&(!t||g.saleDate<=t)&&(!l||g.locationName===l)&&(!q||customer)&&(!st||clean(groupRequestStatus(g)).toLowerCase()===st)});const pageCount=Math.max(1,Math.ceil(filteredGroups.length/MAIN_PAGE_SIZE));if(mainPage>pageCount)mainPage=pageCount;if(mainPage<1)mainPage=1;renderGroups()};clearFilters=function(){const a=document.getElementById('dateFrom'),b=document.getElementById('dateTo'),l=document.getElementById('locationFilter'),q=document.getElementById('bbCustomerSearch'),s=document.getElementById('bbStatusFilter');if(a)a.value='';if(b)b.value='';if(l)l.value='';if(q)q.value='';if(s)s.value='';mainPage=1;applyFilters()};return true}
function polishRows(){const body=document.getElementById('summaryBody');if(!body)return;body.querySelectorAll(':scope > tr').forEach(tr=>{tr.classList.toggle('bb-empty-row',!!tr.querySelector('td.empty'));const cells=tr.children;if(cells.length<12)return;const primary=cells[11].querySelector('.btn.primary');if(primary)primary.textContent='View';const req=cells[11].querySelector('.btn.request');if(req&&!req.disabled)req.textContent='Close';});const spans=document.querySelectorAll('.requestbar .sum span');if(spans[0]&&spans[0].firstChild)spans[0].firstChild.nodeValue='Selected Groups';}
function polishCloseRows(){const body=document.getElementById('cashRequestList');if(!body)return;body.querySelectorAll(':scope > tr').forEach(tr=>{const cells=tr.children;if(cells.length<12)return;const action=cells[11].querySelector('.btn');if(action){const t=clean(action.textContent).toLowerCase();if(t.includes('remove'))action.textContent='Remove';}})}
function observe(){const body=document.getElementById('summaryBody');if(body&&!body.__bbMobileObserved){body.__bbMobileObserved=true;new MutationObserver(()=>requestAnimationFrame(()=>{polishRows();populateStatus()})).observe(body,{childList:true,subtree:true});}const closeBody=document.getElementById('cashRequestList');if(closeBody&&!closeBody.__bbMobileObserved){closeBody.__bbMobileObserved=true;new MutationObserver(()=>requestAnimationFrame(polishCloseRows)).observe(closeBody,{childList:true,subtree:true});}const closeOverlay=document.getElementById('cashRequestOverlay');if(closeOverlay&&!closeOverlay.__bbMobileObserved){closeOverlay.__bbMobileObserved=true;new MutationObserver(()=>{if(!closeOverlay.classList.contains('hidden'))setTimeout(()=>{polishCloseRows();closeOverlay.querySelector('.close-workspace')?.scrollTo(0,0)},20)}).observe(closeOverlay,{attributes:true,attributeFilter:['class']});}const previewOverlay=document.getElementById('previewOverlay');if(previewOverlay&&!previewOverlay.__bbMobileObserved){previewOverlay.__bbMobileObserved=true;new MutationObserver(()=>{if(!previewOverlay.classList.contains('hidden'))setTimeout(()=>previewOverlay.querySelector('.modal')?.scrollTo(0,0),20)}).observe(previewOverlay,{attributes:true,attributeFilter:['class']});}}
function bootMobile(){if(!ensureFilters()){setTimeout(bootMobile,100);return}if(!installFilterOverride()){setTimeout(bootMobile,100);return}populateStatus();polishRows();polishCloseRows();observe();setTimeout(()=>{populateStatus();polishRows();polishCloseRows()},400)}
bootMobile();
})();`;
function inject(){let doc;try{doc=frame.contentDocument||frame.contentWindow.document}catch(_){return}if(!doc||!doc.head)return;let style=doc.getElementById('bb-mobile-collection-skin');if(!style){style=doc.createElement('style');style.id='bb-mobile-collection-skin';doc.head.appendChild(style)}style.textContent=MOBILE_CSS;if(!doc.getElementById('bb-mobile-collection-script')){const script=doc.createElement('script');script.id='bb-mobile-collection-script';script.textContent=MOBILE_SCRIPT;doc.body.appendChild(script)}boot.classList.add('hide')}

})();
