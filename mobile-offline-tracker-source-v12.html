<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Batch Selling Tracker</title></head><body style="font:14px Arial;color:#17304f;padding:16px"><div id="boot" role="status">Opening saved Batch Selling Tracker…</div><script>
(async function(){
 const status=document.getElementById('boot');
 try{
  const response=await fetch('/big-brother-batch-selling-tracker/index.html',{cache:'no-store'});
  if(!response.ok)throw Error('Current tracker interface is not saved yet. Connect to update.');
  let html=await response.text();
  const rpc=/async function rpc\(name,args\)\{[^\n]+\}/g;
  const preview='async function openInvoiceFromTracker(row){';
  if((html.match(rpc)||[]).length!==1||html.split(preview).length!==2||!html.includes('function openDetail('))throw Error('Tracker source changed. Offline update required.');
  html=html.replace(rpc,'async function rpc(name,args){return window.BBStaffOfflineV12.rpc(name,args)}');
  html=html.replace(preview,preview+'\n if(row){openDetail(row);return;}\n');
  const head=html.toLowerCase().indexOf('</head>');
  if(head<0)throw Error('Tracker interface unavailable.');
  html=html.slice(0,head)+'<scr'+'ipt src="mobile-offline-staff-adapter-v12.js?v=20261128-shared-daily-v1"></scr'+'ipt>'+html.slice(head);
  document.open();document.write(html);document.close();
 }catch(error){status.textContent=error.message||'Saved tracker unavailable.';}
})();
</script></body></html>
