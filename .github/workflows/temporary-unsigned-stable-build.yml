name: Temporary unsigned stable APK compilation for local private signing
on:
  push:
    paths:
      - '.github/workflows/temporary-unsigned-stable-build.yml'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install existing BIG BROTHER logo
        run: |
          mkdir -p android-local-app/app/src/main/res/drawable-nodpi
          mkdir -p android-online-app/app/src/main/res/drawable-nodpi
          cp pwa-icon-192.png android-local-app/app/src/main/res/drawable-nodpi/launcher.png
          cp pwa-icon-192.png android-online-app/app/src/main/res/drawable-nodpi/launcher.png
      - name: Build unsigned release to be signed privately OFF GitHub
        run: |
          gradle --no-daemon -p android-local-app assembleRelease
          gradle --no-daemon -p android-online-app assembleRelease
          mkdir -p tmp-stable-build
          find android-local-app/app/build/outputs/apk/release/ -maxdepth 1 -type f -print
          find android-online-app/app/build/outputs/apk/release/ -maxdepth 1 -type f -print
          cp android-local-app/app/build/outputs/apk/release/app-release-unsigned.apk tmp-stable-build/BIG-BROTHER-Local-unsigned.apk
          cp android-online-app/app/build/outputs/apk/release/app-release-unsigned.apk tmp-stable-build/BIG-BROTHER-Online-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" tmp-stable-build/apksigner.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" tmp-stable-build/apksigner
      - uses: actions/upload-artifact@v4
        with:
          name: INTERNAL-unsigned-stable-test-not-installable
          path: tmp-stable-build/*
          retention-days: 1
