name: Build BIG BROTHER Stable Android APKs
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-local-app/**'
      - 'android-online-app/**'
      - '.github/workflows/build-big-brother-stable-android.yml'
permissions:
  contents: read
jobs:
  signed-stable-apps:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Check permanent signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.BB_STABLE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BB_STABLE_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_B64" || -z "$KEYSTORE_PASSWORD" ]]; then
            echo "::error::Configure BOTH BB_STABLE_KEYSTORE_B64 and BB_STABLE_KEYSTORE_PASSWORD in GitHub Actions repository secrets."
            exit 1
          fi
      - name: Prepare signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.BB_STABLE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BB_STABLE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/BB-Android-Stable-Release.p12"
          test -s "$RUNNER_TEMP/BB-Android-Stable-Release.p12"
          keytool -list -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/BB-Android-Stable-Release.p12" \
            -storepass "$KEYSTORE_PASSWORD" -alias bigbrother >/dev/null
          echo "BB_STABLE_KEYSTORE_FILE=$RUNNER_TEMP/BB-Android-Stable-Release.p12" >> "$GITHUB_ENV"
          echo "BB_STABLE_VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "Permanent signing key verified. Secrets were not printed."
      - name: Use existing BIG BROTHER launcher logo
        run: |
          mkdir -p android-local-app/app/src/main/res/drawable-nodpi
          mkdir -p android-online-app/app/src/main/res/drawable-nodpi
          cp pwa-icon-192.png android-local-app/app/src/main/res/drawable-nodpi/launcher.png
          cp pwa-icon-192.png android-online-app/app/src/main/res/drawable-nodpi/launcher.png
      - name: Build both permanently signed APKs
        env:
          BB_STABLE_KEYSTORE_PASSWORD: ${{ secrets.BB_STABLE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon -p android-local-app assembleRelease
          gradle --no-daemon -p android-online-app assembleRelease
      - name: Verify release signature and update package IDs
        run: |
          set -euo pipefail
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          for apk in \
            android-local-app/app/build/outputs/apk/release/app-release.apk \
            android-online-app/app/build/outputs/apk/release/app-release.apk
          do
            test -s "$apk"
            "$SIGNER" verify --verbose --print-certs "$apk"
            "$AAPT" dump badging "$apk" | head -1
          done
      - name: Publish installable BIG BROTHER Local stable APK
        uses: actions/upload-artifact@v4
        with:
          name: BIG-BROTHER-Local-Stable-Signed-APK
          path: android-local-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
      - name: Publish installable BIG BROTHER Online stable APK
        uses: actions/upload-artifact@v4
        with:
          name: BIG-BROTHER-Online-Stable-Signed-APK
          path: android-online-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
      - name: Remove temporary signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/BB-Android-Stable-Release.p12"
