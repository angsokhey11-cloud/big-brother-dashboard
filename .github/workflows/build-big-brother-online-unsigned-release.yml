name: Build BIG BROTHER Online unsigned release for local private signing
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-big-brother-online-unsigned-release.yml'
permissions:
  contents: read
jobs:
  unsigned-online:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Supply existing BIG BROTHER icon
        run: |
          mkdir -p android-online-app/app/src/main/res/drawable-nodpi
          cp pwa-icon-192.png android-online-app/app/src/main/res/drawable-nodpi/launcher.png
      - name: Build unsigned Online stable release only
        run: gradle --no-daemon -p android-online-app assembleRelease
      - name: Pack unsigned APK and public Android signing utilities
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bb-unsigned"
          cp android-online-app/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/bb-unsigned/"
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" "$RUNNER_TEMP/bb-unsigned/"
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" "$RUNNER_TEMP/bb-unsigned/"
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt" "$RUNNER_TEMP/bb-unsigned/"
          cp "$ANDROID_HOME/build-tools/35.0.0/lib64/libc++.so" "$RUNNER_TEMP/bb-unsigned/" || true
      - name: Upload unsigned APK and signing tools (no secret keys)
        uses: actions/upload-artifact@v4
        with:
          name: BIG-BROTHER-Online-v1.0.5-Unsigned-And-SigningTools
          path: ${{ runner.temp }}/bb-unsigned/
          retention-days: 3
