name: One-shot BIG BROTHER Local v1.0.4 unsigned compilation
on:
  push:
    paths:
      - '.github/workflows/build-bb-local-v104-unsigned-one-shot.yml'
permissions:
  contents: read
jobs:
  compile-local:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Use existing BIG BROTHER logo
        run: |
          mkdir -p android-local-app/app/src/main/res/drawable-nodpi
          cp pwa-icon-192.png android-local-app/app/src/main/res/drawable-nodpi/launcher.png
      - name: Compile unsigned production APK
        run: |
          set -euo pipefail
          gradle --no-daemon -p android-local-app assembleRelease
          test -s android-local-app/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload unsigned APK for private local signing
        uses: actions/upload-artifact@v4
        with:
          name: BB-Local-v104-unsigned-internal
          path: android-local-app/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 1
