name: Stock Source V2 — staged SQL safety
on:
  push:
    branches:
      - feature/stock-source-accounting-20261031
    paths:
      - 'docs/stock-source-accounting-v2/**'
      - '.github/workflows/stock-source-v2-safety-ci.yml'
  pull_request:
    paths:
      - 'docs/stock-source-accounting-v2/**'
      - '.github/workflows/stock-source-v2-safety-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify staged SQL parses as PostgreSQL statements
        run: |
          python3 -m pip install --user 'pglast>=7,<8'
          python3 - <<'PY'
          from pathlib import Path
          from pglast import parse_sql
          root = Path('docs/stock-source-accounting-v2')
          for name, expected in [
            ('20261031_source_aware_batch_sale_and_back_sale_STAGED.sql', 3),
            ('20261031_exact_batch_reversal_sources_STAGED.sql', 6),
            ('20261031_reversal_source_snapshot_STAGED.sql', 1),
          ]:
            sql = (root / name).read_text(encoding='utf-8')
            parsed = parse_sql(sql)
            functions = sql.upper().count('CREATE OR REPLACE FUNCTION')
            if functions != expected:
              raise AssertionError(f'{name}: expected {expected} functions, got {functions}')
            if len(parsed) < expected:
              raise AssertionError(f'{name}: parsed {len(parsed)} statements, expected >= {expected}')
            print(f'PASS {name}: {functions} definitions; {len(parsed)} SQL statements')
          PY
      - name: Validate Windows PowerShell helper syntax
        shell: pwsh
        run: |
          $files = @(
            'docs/stock-source-accounting-v2/EXTRACT-LOCAL-SCHEMA-ONLY-NONDESTRUCTIVE.ps1',
            'docs/stock-source-accounting-v2/RUN-BB-STOCK-SOURCE-V2-STEP2-BACKSALE.ps1',
            'docs/stock-source-accounting-v2/TEST-ISOLATED-POSTGRES-STEP2-BACKSALE.ps1'
          )
          foreach($file in $files){
            $tokens=$null
            $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($file,[ref]$tokens,[ref]$errors) | Out-Null
            if($errors.Count -gt 0){
              $errors | Format-List | Out-String | Write-Host
              throw "PowerShell syntax invalid: $file"
            }
            Write-Host "PASS PowerShell syntax: $file"
          }
      - name: Start no-network ephemeral PostgreSQL for synthetic arithmetic
        run: |
          docker run -d --name bb-stock-v2-safety-test --network none             -e POSTGRES_PASSWORD=disposable-local-ci-only postgres:17
          for i in $(seq 1 35); do
            if docker exec bb-stock-v2-safety-test psql -U postgres -d postgres -tAc 'SELECT 1;' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec bb-stock-v2-safety-test psql -U postgres -d postgres -tAc 'SELECT 1;'
          docker cp docs/stock-source-accounting-v2/SOURCE-ARITHMETIC-SMOKE-READONLY.sql             bb-stock-v2-safety-test:/tmp/source-smoke.sql
          docker exec bb-stock-v2-safety-test psql -X -v ON_ERROR_STOP=1 -A -t -F '|'             -U postgres -d postgres -f /tmp/source-smoke.sql > /tmp/bb-v2-arithmetic-result.txt
          python3 - <<'PY'
          from pathlib import Path
          rows = [r.split('|') for r in Path('/tmp/bb-v2-arithmetic-result.txt').read_text().splitlines() if '|' in r]
          assert len(rows) == 12, f'Expected 12 arithmetic cases, got {len(rows)}'
          bad = [r for r in rows if len(r) < 4 or r[3] != 't']
          assert not bad, f'Failed source arithmetic cases: {bad}'
          print('PASS: 12/12 synthetic stock-source arithmetic cases')
          PY
      - name: Remove only ephemeral CI PostgreSQL
        if: always()
        run: docker rm -f bb-stock-v2-safety-test || true
  back-sale-synthetic-integration:
    name: Actual Back Sale function (synthetic isolated PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Select ONLY real staged Back Sale function for isolated execution
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('docs/stock-source-accounting-v2/20261031_source_aware_batch_sale_and_back_sale_STAGED.sql').read_text(encoding='utf8')
          needle='CREATE OR REPLACE FUNCTION public.bb_stock_save_batch_reference_internal('
          assert s.count(needle)==1, 'Expected single staged Back Sale function'
          selected=s[s.index(needle):].strip()
          assert selected.endswith(';'), 'Staged SQL must terminate with semicolon'
          assert selected.count('CREATE OR REPLACE FUNCTION')==1, 'Unexpected SQL in isolated selection'
          Path('/tmp/bb-ci-staged-back-sale.sql').write_text(selected+'\n',encoding='utf8')
          print('Real staged Back Sale PL/pgSQL function selected (NOT a mocked function)')
          PY
      - name: Start NO NETWORK synthetic PostgreSQL 17 and run real Back Sale 7 cases
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name bb-v2-back-sale-synthetic --network none \
            -e POSTGRES_PASSWORD=ci-disposable postgres:17
          for i in $(seq 1 40); do
            if docker exec bb-v2-back-sale-synthetic psql -X -U postgres -d postgres -tAc 'SELECT 1;' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec bb-v2-back-sale-synthetic psql -X -v ON_ERROR_STOP=1 -U postgres \
            -d postgres -c 'CREATE DATABASE bb_stock_v2_sandbox;'
          docker cp docs/stock-source-accounting-v2/CI-BACKSALE-SYNTHETIC-SCHEMA.sql \
            bb-v2-back-sale-synthetic:/tmp/schema.sql
          docker cp /tmp/bb-ci-staged-back-sale.sql \
            bb-v2-back-sale-synthetic:/tmp/staged.sql
          docker cp docs/stock-source-accounting-v2/ACTUAL-BACK-SALE-SOURCE-ROLLBACK-ISOLATED.sql \
            bb-v2-back-sale-synthetic:/tmp/cases.sql
          docker exec bb-v2-back-sale-synthetic psql -X -v ON_ERROR_STOP=1 \
            -U postgres -d bb_stock_v2_sandbox -f /tmp/schema.sql
          docker exec bb-v2-back-sale-synthetic psql -X -v ON_ERROR_STOP=1 \
            -U postgres -d bb_stock_v2_sandbox -f /tmp/staged.sql
          docker exec bb-v2-back-sale-synthetic psql -X -v ON_ERROR_STOP=1 \
            -U postgres -d bb_stock_v2_sandbox -f /tmp/cases.sql 2>&1 | tee /tmp/back-sale-results.log
          grep -q 'PASS CASE 7/7' /tmp/back-sale-results.log
          grep -q 'PASS: post-ROLLBACK Back Sale synthetic ledger/request absent' /tmp/back-sale-results.log
          echo 'PASS 7/7 Back Sale actual-function synthetic cases, post-ROLLBACK verified'
      - name: Remove ONLY synthetic CI PostgreSQL
        if: always()
        run: docker rm -f bb-v2-back-sale-synthetic || true
