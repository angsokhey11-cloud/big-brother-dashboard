plugins {
    id 'com.android.application'
}

// Stable release signing is supplied ONLY from protected GitHub Actions secrets.
// Do not put the private keystore or its password in the public repository.
def stableStorePath = System.getenv('BB_STABLE_KEYSTORE_FILE')
def stableStorePassword = System.getenv('BB_STABLE_KEYSTORE_PASSWORD')
def stableVersionCode = System.getenv('BB_STABLE_VERSION_CODE')
def stableVersionName = System.getenv('BB_STABLE_VERSION_NAME')

android {
    namespace 'com.bigbrother.online'
    compileSdk 35
    defaultConfig {
        applicationId 'com.bigbrother.online'
        minSdk 26
        targetSdk 35
        versionCode stableVersionCode ? Integer.parseInt(stableVersionCode) : 4
        versionName stableVersionName ?: '1.0.4'
    }
    signingConfigs {
        bbStable {
            if (stableStorePath && stableStorePassword) {
                storeFile file(stableStorePath)
                storePassword stableStorePassword
                keyAlias 'bigbrother'
                keyPassword stableStorePassword
                storeType 'pkcs12'
            }
        }
    }
    buildTypes {
        // Keep the old preview package IDs untouched for data-safe migration.
        debug { minifyEnabled false }
        // A separate permanent app can be installed beside legacy debug APKs.
        // Future stable releases use the SAME package ID + SAME certificate.
        release {
            applicationIdSuffix '.stable'
            versionNameSuffix '-stable'
            minifyEnabled false
            if (stableStorePath && stableStorePassword) {
                signingConfig signingConfigs.bbStable
            }
        }
    }
    dependencies {
        implementation 'com.google.firebase:firebase-messaging:26.0.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
