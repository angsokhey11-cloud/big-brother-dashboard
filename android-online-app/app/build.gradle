plugins {
    id 'com.android.application'
}
android {
    namespace 'com.bigbrother.online'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bigbrother.online'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.0.1-safe-area'
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
