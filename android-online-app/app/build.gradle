plugins {
    id 'com.android.application'
}
android {
    namespace 'com.bigbrother.online'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bigbrother.online'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.0.2-auto-reconnect'
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
