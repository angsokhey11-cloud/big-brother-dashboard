<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Sale Summary</title></head>
<body style="font-family:Arial,sans-serif;color:#17304f;padding:16px"><div id="boot" role="status">Opening saved Daily Sale Summary…</div>
<script>
(async function(){
 const status=document.getElementById('boot');
 try{
  const response=await fetch('/big-brother-daily-sale-summary/legacy-google-v1.html',{cache:'no-store'});
  if(!response.ok)throw Error('Current report interface is not saved yet. Open BIG BROTHER online first.');
  let html=await response.text();
  if(!html.includes('id="bbSaleFilters"')||!html.includes('id="bbInvoiceStage"'))throw Error('Saved report interface is incompatible. Reconnect to update.');
  const marker='loadInvoices(false);';
  if(html.split(marker).length!==2)throw Error('Report initialization changed.');
  html=html.replace(marker,'api = window.BBStaffOfflineV12.dailyApi;\n'+marker);
  html=html.replace(/<script src="https:\/\/cdnjs\.cloudflare\.com\/ajax\/libs\/(?:html2canvas|jspdf)\/[^"]+"><\/script>/g,'');
  const headClose=html.toLowerCase().indexOf('</head>');
  if(headClose<0)throw Error('Report source unavailable.');
  const adapter='<scr'+'ipt src="mobile-offline-staff-adapter-v12.js?v=20261128-shared-daily-v1"></scr'+'ipt>';
  const style='<style>#shareTelegramBtn,#downloadSummaryBtn,#downloadPictureBtn{display:none!important}</style>';
  html=html.slice(0,headClose)+adapter+style+html.slice(headClose);
  document.open();document.write(html);document.close();
 }catch(error){status.textContent=error.message||'Saved report unavailable.';}
})();
</script></body></html>
